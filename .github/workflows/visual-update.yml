name: Visual baseline update

# P5-T2 冻结机制：golden diff 基线只在 GitHub Actions ubuntu-latest + chromium 产出。
# 用途：基线建立/变更（如 T6 Sidebar 宽度调整）时手动触发，下载 artifact 入仓。
# 触发后须在本任务 PR 中说明基线变更原因。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update @visual baselines (canonical Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:visual:update
        env:
          CI: 'true'
          PYTHON_BIN: python
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 7
