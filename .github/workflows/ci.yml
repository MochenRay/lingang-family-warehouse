name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python -m pytest backend/tests

  e2e:
    name: Local SQLite smoke
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
        env:
          CI: 'true'
          PYTHON_BIN: python
      - run: npm run test:e2e:public
        env:
          CI: 'true'
          PYTHON_BIN: python
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/
            playwright-report-public/
            test-results/playwright-public/
          if-no-files-found: ignore
          retention-days: 7

  performance:
    name: Route performance budget
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - name: Enforce route performance budget
        run: npm run test:e2e:perf
        env:
          CI: 'true'
          PYTHON_BIN: python
          TZ: Asia/Shanghai
          PERF_AUTO_CANDIDATE_ON_REFRESH: '1'
          PERF_EXECUTION_CLASS: ci-performance
          PERF_REQUIRE_CANONICAL_BASELINE: '1'
      - name: Upload route performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-performance
          path: |
            test-results/performance/current.json
            test-results/performance/baseline-candidate.json
            test-results/performance/summary.md
            test-results/playwright-performance/
            playwright-report-performance/
          if-no-files-found: warn
          retention-days: 14
